<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Text-free markup on purpose: every word lives in strings-de.js / strings-en.js
     and is written in by i18n.js, so a string exists in exactly one place and the
     two languages cannot drift from the page. The title keeps the product name as
     its pre-script value so the tab is never blank. -->
<title data-i18n="shell.title">MetaClassify</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<!-- Self-contained on purpose: no CDN fonts/scripts (GDPR: no third-party IP leak). -->
</head>
<body>
<a class="skip-link" href="#main" data-i18n="shell.skipToContent"></a>

<div id="app">
  <!-- ======= Login: slim bar at the top edge (shown until a key is verified) ======= -->
  <section id="view-login" hidden>
    <form id="login-form" class="login-bar" novalidate>
      <h1 class="brand" data-i18n="shell.brand"></h1>
      <label for="api-key" data-i18n="login.apiKey"></label>
      <input id="api-key" name="api-key" type="password" autocomplete="off"
             required aria-describedby="login-error login-hint">
      <button type="submit" id="login-btn" data-i18n="login.signIn"></button>
      <!-- Also on the login bar: someone who cannot read the language yet is
           exactly the person who needs the switch, and the app shell behind the
           key may be a screen they never reach. -->
      <label class="lang-switch">
        <span class="visually-hidden" data-i18n="shell.language"></span>
        <select class="lang-select">
          <option value="de" lang="de" data-i18n="shell.language.de"></option>
          <option value="en" lang="en" data-i18n="shell.language.en"></option>
        </select>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
    <p id="login-hint" class="muted login-hint" data-i18n="login.hint"></p>
  </section>

  <!-- ======= App shell ======= -->
  <div id="view-app" hidden>
    <header class="topbar">
      <span class="brand" data-i18n-html="shell.brandWithRole"></span>
      <nav data-i18n-aria-label="shell.sections" role="tablist">
        <button class="tab" data-tab="query"    id="tab-btn-query"    role="tab" aria-controls="tab-query"    aria-selected="true"  tabindex="0"  data-i18n="shell.tab.query"></button>
        <button class="tab" data-tab="training" id="tab-btn-training" role="tab" aria-controls="tab-training" aria-selected="false" tabindex="-1" data-i18n="shell.tab.training"></button>
        <button class="tab" data-tab="models"   id="tab-btn-models"   role="tab" aria-controls="tab-models"   aria-selected="false" tabindex="-1" data-i18n="shell.tab.models"></button>
        <button class="tab" data-tab="datasets" id="tab-btn-datasets" role="tab" aria-controls="tab-datasets" aria-selected="false" tabindex="-1" data-i18n="shell.tab.datasets"></button>
      </nav>
      <button id="train-chip" class="chip" hidden data-i18n-title="shell.trainChip"></button>
      <span id="auth-off-badge" class="muted" hidden data-i18n="shell.authDisabled"></span>
      <label class="lang-switch">
        <span class="visually-hidden" data-i18n="shell.language"></span>
        <select class="lang-select">
          <option value="de" lang="de" data-i18n="shell.language.de"></option>
          <option value="en" lang="en" data-i18n="shell.language.en"></option>
        </select>
      </label>
      <button id="logout-btn" class="ghost" data-i18n-title="shell.signOutHint" data-i18n="shell.signOut"></button>
    </header>

    <main id="main">
      <!-- ---- Query ---- -->
      <section id="tab-query" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-query" tabindex="0">
        <h2 data-i18n="query.heading"></h2>
        <form id="query-form" class="card">
          <fieldset class="modes">
            <legend data-i18n="query.mode.legend"></legend>
            <label class="check"><input type="radio" name="query-mode" value="one" checked>
              <span data-i18n-html="query.mode.one"></span></label>
            <label class="check"><input type="radio" name="query-mode" value="many">
              <span data-i18n-html="query.mode.many"></span></label>
            <label class="check"><input type="radio" name="query-mode" value="csv">
              <span data-i18n-html="query.mode.csv"></span></label>
          </fieldset>

          <div id="query-input-one">
            <label for="query-text" data-i18n="query.text.label"></label>
            <textarea id="query-text" rows="3" data-i18n-placeholder="query.text.placeholder"></textarea>
          </div>
          <div id="query-input-many" hidden>
            <label for="query-lines" data-i18n="query.lines.label"></label>
            <textarea id="query-lines" rows="8" aria-describedby="query-lines-hint"
                      data-i18n-placeholder="query.lines.placeholder"></textarea>
            <p id="query-lines-hint" class="muted" data-i18n="query.lines.hint"></p>
          </div>
          <div id="query-input-csv" hidden>
            <label for="query-file" data-i18n="query.file.label"></label>
            <input id="query-file" type="file" accept=".csv,text/csv" aria-describedby="query-file-hint">
            <p id="query-file-hint" class="muted" data-i18n="query.file.hint"></p>
            <label for="query-separator" data-i18n="query.separator.label"></label>
            <input id="query-separator" type="text" value=";" size="3" maxlength="1">
          </div>

          <div class="row">
            <div>
              <label for="query-models" data-i18n="query.models.label"></label>
              <select id="query-models" multiple size="4" required></select>
            </div>
            <div class="opts">
              <label for="query-topk" data-i18n-html="query.topk.label"></label>
              <input id="query-topk" type="number" min="0" max="1000" inputmode="numeric">
              <div id="query-signals">
                <label class="check"><input id="query-diff" type="checkbox" checked>
                  <span data-i18n-html="query.diff.label"></span></label>
                <label class="check"><input id="query-f1" type="checkbox" checked>
                  <span data-i18n-html="query.f1.label"></span></label>
              </div>
            </div>
          </div>
          <button type="submit" id="query-btn" data-i18n="query.submit.one"></button>
        </form>
        <details class="help" data-i18n-html="query.help"></details>
        <div id="query-status" aria-live="polite"></div>
        <div id="query-results"></div>
      </section>

      <!-- ---- Training ---- -->
      <section id="tab-training" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-training" tabindex="0" hidden>
        <h2 data-i18n="train.heading"></h2>
        <div class="card" id="train-status-card">
          <h3 data-i18n="train.status.heading"></h3>
          <!-- The card re-renders every poll tick (elapsed/ETA count up), so it must
               NOT be a live region — SRs would re-announce it continuously. Phase
               transitions are announced via the dedicated SR-only element below. -->
          <div id="train-status" class="train-status">
            <p class="muted" data-i18n="train.status.loading"></p>
          </div>
          <p id="train-announce" class="visually-hidden" aria-live="polite"></p>
          <p id="train-queue" class="muted" aria-live="polite" hidden></p>
        </div>
        <form id="train-form" class="card">
          <h3 data-i18n-html="train.form.heading"></h3>
          <div class="row">
            <div>
              <label for="train-dataset" data-i18n="train.dataset.label"></label>
              <select id="train-dataset" required></select>
            </div>
            <div>
              <label for="train-name" data-i18n="train.name.label"></label>
              <!-- No client-side pattern: the char class safe_name enforces is not
                   expressible as a v-flag-valid pattern; the server's crafted 400
                   (name rules) is the single source of truth. -->
              <input id="train-name" required data-i18n-placeholder="train.name.placeholder">
            </div>
          </div>
          <fieldset>
            <legend data-i18n="train.textColumns.legend"></legend>
            <div class="pillbox">
              <span id="textcol-pills"></span>
              <input id="textcol-input" type="text" list="textcol-options" disabled
                     data-i18n-aria-label="train.textColumns.add" aria-describedby="textcol-help"
                     data-i18n-placeholder="train.pills.emptyHint">
              <datalist id="textcol-options"></datalist>
            </div>
            <p id="textcol-help" class="muted" data-i18n="train.textColumns.help"></p>
            <div id="textcol-weights" hidden>
              <p class="muted" id="textcol-weights-help" data-i18n-html="train.weights.help"></p>
              <div id="textcol-weights-fields" class="weights"></div>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n-html="train.labelFields.legend"></legend>
            <div class="pillbox">
              <span id="labelcol-pills"></span>
              <input id="labelcol-input" type="text" list="labelcol-options" disabled
                     data-i18n-aria-label="train.labelFields.add" aria-describedby="train-names-preview"
                     data-i18n-placeholder="train.pills.emptyHint">
              <datalist id="labelcol-options"></datalist>
            </div>
            <p id="train-names-preview" class="muted" aria-live="polite"></p>
          </fieldset>
          <div class="row">
            <div>
              <label for="train-profile" data-i18n="train.profile.label"></label>
              <select id="train-profile"></select>
            </div>
          </div>
          <div class="row">
            <div>
              <label for="train-filter" data-i18n-html="train.filter.label"></label>
              <input id="train-filter" data-i18n-placeholder="train.filter.placeholder">
            </div>
            <div>
              <label for="train-cv" data-i18n="train.cv.label"></label>
              <select id="train-cv">
                <option value="" data-i18n="train.cv.profileDefault"></option>
                <option value="0" data-i18n="train.cv.holdout"></option>
                <option value="3" data-i18n="train.cv.folds3"></option>
                <option value="5" data-i18n="train.cv.folds5"></option>
                <option value="10" data-i18n="train.cv.folds10"></option>
              </select>
            </div>
            <div>
              <label for="train-minsamples" data-i18n-html="train.minSamples.label"></label>
              <input id="train-minsamples" type="number" min="1" step="1" value="20"
                     aria-describedby="train-minsamples-help">
              <p id="train-minsamples-help" class="muted" data-i18n="train.minSamples.help"></p>
            </div>
          </div>
          <button type="button" class="small ghost" id="train-preflight" data-i18n="train.preflight.button"></button>
          <p class="muted" data-i18n="train.preflight.help"></p>
          <div id="train-preflight-out" aria-live="polite"></div>
          <details>
            <summary data-i18n-html="train.caps.summary"></summary>
            <p class="muted" id="train-caps-help" data-i18n-html="train.caps.help"></p>
            <div class="row">
              <div>
                <label for="train-maxword" data-i18n="train.maxWord.label"></label>
                <input id="train-maxword" type="number" min="1000" max="2000000" step="1000"
                       data-i18n-placeholder="train.caps.placeholder" aria-describedby="train-caps-help">
              </div>
              <div>
                <label for="train-maxchar" data-i18n="train.maxChar.label"></label>
                <input id="train-maxchar" type="number" min="1000" max="2000000" step="1000"
                       data-i18n-placeholder="train.caps.placeholder" aria-describedby="train-caps-help">
              </div>
            </div>
          </details>
          <p id="train-error" class="error" role="alert" hidden></p>
          <button type="submit" id="train-btn" data-i18n="train.submit"></button>
        </form>
        <details class="help" data-i18n-html="train.help"></details>
      </section>

      <!-- ---- Models ---- -->
      <section id="tab-models" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-models" tabindex="0" hidden>
        <h2 data-i18n="models.heading"></h2>
        <form id="import-form" class="card">
          <h3 data-i18n-html="models.import.heading"></h3>
          <div class="row">
            <div>
              <label for="import-file" data-i18n="models.import.file"></label>
              <input id="import-file" type="file" accept=".zip" required>
            </div>
            <div>
              <label for="import-name" data-i18n-html="models.import.name"></label>
              <input id="import-name" data-i18n-placeholder="models.import.namePlaceholder">
            </div>
          </div>
          <p id="import-error" class="error" role="alert" hidden></p>
          <button type="submit" id="import-btn" data-i18n="models.import.submit"></button>
        </form>
        <details class="help" data-i18n-html="models.help"></details>
        <div id="models-share" aria-live="polite"></div>
        <div id="models-links"></div>
        <div id="models-list" aria-live="polite"><p class="muted" data-i18n="common.loading"></p></div>
      </section>

      <!-- ---- Datasets ---- -->
      <section id="tab-datasets" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-datasets" tabindex="0" hidden>
        <h2 data-i18n="datasets.heading"></h2>
        <form id="upload-form" class="card">
          <h3 data-i18n-html="datasets.upload.heading"></h3>
          <label for="upload-file" data-i18n-html="datasets.upload.file"></label>
          <input id="upload-file" type="file" accept=".csv,.csv.gz,.gz" required>
          <p id="upload-error" class="error" role="alert" hidden></p>
          <button type="submit" id="upload-btn" data-i18n="datasets.upload.submit"></button>
        </form>
        <details class="help" data-i18n-html="datasets.help"></details>
        <div id="datasets-share" aria-live="polite"></div>
        <div id="datasets-links"></div>
        <div id="datasets-list" aria-live="polite"><p class="muted" data-i18n="common.loading"></p></div>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>

<!-- The string maps come first: every module below may call t() while it loads,
     and the pill pickers in training.js do exactly that at construction time. -->
<script src="strings-de.js"></script>
<script src="strings-en.js"></script>
<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="pills.js"></script>
<script src="query.js"></script>
<script src="explain.js"></script>
<script src="feedback.js"></script>
<script src="share.js"></script>
<script src="models.js"></script>
<script src="model-detail.js"></script>
<script src="model-evaluate.js"></script>
<script src="datasets.js"></script>
<script src="dataset-detail.js"></script>
<script src="train-status.js"></script>
<script src="training.js"></script>
<script src="app.js"></script>
<dialog id="model-detail" aria-labelledby="model-detail-title"></dialog>
<dialog id="dataset-detail" aria-labelledby="dataset-detail-title"></dialog>
</body>
</html>
