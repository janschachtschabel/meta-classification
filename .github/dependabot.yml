# Dependabot keeps the SHA-pinned GitHub Actions current: on a new release it
# opens a PR bumping both the commit SHA and the `# vX` comment in the workflows.
# Python dependencies are intentionally NOT managed here — they are hash-locked
# and updated deliberately (see CLAUDE.md: "no new dependency without written
# justification"), so automated pip PRs would fight that process.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
