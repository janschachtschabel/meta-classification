name: CI — Lint, Types & Tests

# The three quality gates (see CLAUDE.md) plus an OpenAPI smoke check.
# Runs on every push + PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

env:
  # Node 24 as the Action runtime — Node 20 is removed from GitHub
  # runners from Q3 2026 on.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  api:
    name: API — ruff + mypy + pytest + OpenAPI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the Docker base image (python:3.11-slim).
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-hashes.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same fully-hashed transitive tree the Docker image ships.
          pip install --require-hashes -r requirements-hashes.lock
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Types (mypy)
        run: python -m mypy app --config-file pyproject.toml

      - name: Tests (pytest)
        run: python -m pytest tests -q

      - name: OpenAPI smoke
        # The app must import cleanly and expose the core endpoints.
        run: |
          python - <<'PY'
          from app.main import create_app
          schema = create_app().openapi()
          for path in ("/health", "/train", "/train/status", "/predict", "/models"):
              assert path in schema["paths"], f"{path} missing from OpenAPI schema"
          print(f"OK: {len(schema['paths'])} endpoints in schema")
          PY
