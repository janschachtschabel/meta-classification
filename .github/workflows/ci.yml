name: CI — Lint, Types & Tests

# The three quality gates (see CLAUDE.md) plus an OpenAPI smoke check, and a
# weekly vulnerability scan of the pinned dependency tree.
# Runs on every push + PR to main.

on:
  push:
    branches: [main]
    # Tags too. This workflow runs the coverage floor and the OpenAPI smoke, and a
    # release should not be gated more weakly than a push.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:17 UTC. A CVE is published against a version we already pinned,
    # so the scan has to run on a clock, not only when someone pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# One run per ref. Two quick pushes otherwise run concurrently and the older one can
# report last. Tag builds are never cancelled: a release must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Node 24 as the Action runtime — Node 20 is removed from GitHub
  # runners from Q3 2026 on.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  api:
    name: API — ruff + mypy + pytest + OpenAPI smoke
    runs-on: ubuntu-latest
    # A hang here is a deadlock, not slow work: the suite waits on thread
    # rendezvous with generous timeouts of its own, so without this the job sits
    # for GitHub's 360-minute default instead of failing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the Docker base image (python:3.11-slim).
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-hashes.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same fully-hashed transitive tree the Docker image ships.
          pip install --require-hashes -r requirements-hashes.lock
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts

      - name: Types (mypy)
        # `app` plus the two scripts that WRITE inside a model bundle: they edit the
        # config.json the registry trusts, so they earn the same gate (audit T-5). The
        # benchmark scripts stay out — they read and print, and 40 type errors' worth of
        # cleanup there would buy nothing.
        run: |
          python -m mypy app --config-file pyproject.toml
          python -m mypy scripts/patch_bundle_labels.py scripts/prune_bundle_labels.py \
            --config-file pyproject.toml

      - name: Tests (pytest, under coverage)
        # The gate is the floor in pyproject (fail_under), not this command: a change
        # that deletes a guard and its test stays green on pytest alone.
        # `combine` is needed because the training child is its own interpreter.
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage combine
          python -m coverage report

      - name: OpenAPI smoke
        # The app must import cleanly and expose the core endpoints.
        run: |
          python - <<'PY'
          from app.main import create_app
          schema = create_app().openapi()
          for path in ("/health", "/train", "/train/status", "/predict", "/models"):
              assert path in schema["paths"], f"{path} missing from OpenAPI schema"
          print(f"OK: {len(schema['paths'])} endpoints in schema")
          PY

  audit:
    name: Dependencies — pip-audit + licences
    runs-on: ubuntu-latest
    # 15 rather than 10: the licence step installs the resolved runtime tree
    # (numpy/scipy/scikit-learn wheels) to read its metadata.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the Docker base (python:3.11-slim, Linux): the image scan
          # evaluates the lock's platform markers for this interpreter.
          python-version: "3.11"

      - name: Install pip-audit
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Each scan fails the job, which is the point of a weekly run.
      - name: Scan the direct pins, dependencies resolved afresh
        # requirements.lock holds only the 13 direct pins; pip-audit resolves
        # their dependencies anew, so this covers today's newest transitive
        # versions (what a dev install or the next recompile gets), not the
        # ones the image ships. A finding here names the direct package to bump.
        run: python -m pip_audit -r requirements.lock --progress-spinner off

      - name: Scan the tree the image installs
        # requirements-hashes.lock, pin for pin as the Dockerfile installs it,
        # transitive packages included. --disable-pip audits the pins as
        # written; --no-deps alone would still have pip resolve the file in a
        # throwaway venv. Sees what the scan above cannot: anyio 4.14.1 sat
        # pinned here with three CVEs while that scan was green (2026-09-19).
        # Runs even when the scan above failed, so both always report.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit -r requirements-hashes.lock --require-hashes --disable-pip --progress-spinner off

      - name: Licences of the resolved runtime tree
        # The 40-package tree was all-permissive (MIT / BSD-3 / Apache-2.0 / PSF)
        # against an MIT LICENSE when audited by hand — an assessment of one moment,
        # not an invariant. A copyleft package arriving transitively in a routine bump
        # is what this catches.
        #
        # pip-licenses reads *installed* metadata, so the tree has to be present; it is
        # installed here rather than reusing the api job's venv because that one also
        # holds the dev tools, which do not ship. It is the fully hashed tree the image
        # installs: a fresh resolution of requirements.lock's 17 direct pins is the tree
        # the next recompile would get, and the gate judged that one instead of the one
        # that ships (audit 2026-09-30, B05). The tool comes first, pinned with the other
        # dev tools, so the tree's own pins win over anything it pulls in.
        #
        # --partial-match: the denylist is matched inside licence names. Without it whole
        # names were compared, and no package calls its licence "GPL" -- Unidecode's
        # metadata says "GNU General Public License v2 or later (GPLv2+)", and it passed
        # (B05; tests/test_deployment_config.py runs this very command against one).
        #
        # Runs last so a failure in the licence tooling cannot mask a CVE finding.
        #
        # A denylist, not `--allow-only`: two packages in the shipped tree carry MIT
        # licence *text* and non-specific *metadata* — `locate` (via wordfreq) declares
        # the classifier "License :: Other/Proprietary License" and `skops` only
        # "License :: OSI Approved". Both LICENSE files were read and are MIT. An
        # allow-list therefore fails on this tree today; verified, not assumed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pip install pip-licenses==5.5.5
          pip install --require-hashes -r requirements-hashes.lock
          python -m piplicenses --fail-on "GPL;AGPL;LGPL" --partial-match --format markdown --order license
