name: CI — Lint, Types & Tests

# The three quality gates (see CLAUDE.md) plus an OpenAPI smoke check, and a
# weekly vulnerability scan of the pinned dependency tree.
# Runs on every push + PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:17 UTC. A CVE is published against a version we already pinned,
    # so the scan has to run on a clock, not only when someone pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

env:
  # Node 24 as the Action runtime — Node 20 is removed from GitHub
  # runners from Q3 2026 on.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  api:
    name: API — ruff + mypy + pytest + OpenAPI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the Docker base image (python:3.11-slim).
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-hashes.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same fully-hashed transitive tree the Docker image ships.
          pip install --require-hashes -r requirements-hashes.lock
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts

      - name: Types (mypy)
        run: python -m mypy app --config-file pyproject.toml

      - name: Tests (pytest)
        run: python -m pytest tests -q

      - name: OpenAPI smoke
        # The app must import cleanly and expose the core endpoints.
        run: |
          python - <<'PY'
          from app.main import create_app
          schema = create_app().openapi()
          for path in ("/health", "/train", "/train/status", "/predict", "/models"):
              assert path in schema["paths"], f"{path} missing from OpenAPI schema"
          print(f"OK: {len(schema['paths'])} endpoints in schema")
          PY

  audit:
    name: Dependencies — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the Docker base (python:3.11-slim, Linux): the image scan
          # evaluates the lock's platform markers for this interpreter.
          python-version: "3.11"

      - name: Install pip-audit
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Each scan fails the job, which is the point of a weekly run.
      - name: Scan the direct pins, dependencies resolved afresh
        # requirements.lock holds only the 13 direct pins; pip-audit resolves
        # their dependencies anew, so this covers today's newest transitive
        # versions (what a dev install or the next recompile gets), not the
        # ones the image ships. A finding here names the direct package to bump.
        run: python -m pip_audit -r requirements.lock --progress-spinner off

      - name: Scan the tree the image installs
        # requirements-hashes.lock, pin for pin as the Dockerfile installs it,
        # transitive packages included. --disable-pip audits the pins as
        # written; --no-deps alone would still have pip resolve the file in a
        # throwaway venv. Sees what the scan above cannot: anyio 4.14.1 sat
        # pinned here with three CVEs while that scan was green (2026-09-19).
        # Runs even when the scan above failed, so both always report.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit -r requirements-hashes.lock --require-hashes --disable-pip --progress-spinner off
