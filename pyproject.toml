[project]
name = "classification-api-v3"
version = "3.2.0"
description = "MetaClassify — torch-free, CPU-only text-classification API; train on your metadata, serve multiple models via REST"
license = {text = "MIT"}
# 3.11 floor: the Docker base image and requirements-hashes.lock are compiled
# for 3.11, so a 3.10 deploy could hit marker-gated deps missing from the hashes.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.31",
    "slowapi>=0.1.9",
    "scikit-learn>=1.4",
    # Imported directly (deploy.py: parallel_backend) — declared so the version
    # is pinned/tested instead of riding along transitively via scikit-learn.
    "joblib>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "skops>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9", "types-PyYAML>=6.0",
       "coverage[toml]>=7.0"]

# No build-system on purpose: this is an application, not a library.
# Install runtime deps with `pip install -r requirements.txt` and run via uvicorn.

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo'd marker is an error, not a silently inert decorator.
# --strict-config: a typo in THIS block is an error too.
addopts = "--strict-markers --strict-config"
# A warning nobody acts on is a deprecation that lands as a breakage on the next
# upgrade, so they fail here. The one exception is Starlette's own notice that its
# TestClient uses httpx: it fires on import of the test client, the replacement it
# names is not in the pinned tree, and swapping the HTTP client of the whole suite is
# not something to do as a side effect of turning warnings into errors.
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
# The training child is a separate interpreter; without this its lines read as
# uncovered and train_worker looks far worse than it is tested.
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
# Measured 95 % on 2026-09-20. The floor sits a little under it so a legitimate
# platform branch cannot turn CI red, and is meant to be RAISED as it climbs --
# never lowered to accommodate a drop.
fail_under = 92
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM108: forcing multi-line ternaries hurts readability here.
ignore = ["SIM108"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Form()/Body()/Query() in argument defaults is the
# intended idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
# Third-party scientific libs (sklearn, scipy, pandas, skops) ship no type stubs.
disable_error_code = ["import-untyped"]
