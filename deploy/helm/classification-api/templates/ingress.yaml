{{- if .Values.ingress.enabled }}
{{- if and (not .Values.ingress.tls) (not .Values.ingress.allowInsecure) }}
{{- fail (printf "ingress.enabled is true with no ingress.tls: every authenticated request sends X-API-Key as a header, so this would publish the credential in cleartext. Set ingress.tls, or ingress.allowInsecure=true if TLS is terminated above this ingress (mesh, cloud load balancer).") }}
{{- end }}
{{- /* Audit 2026-09-30, S04: values.yaml asked for this and nothing enforced it. */}}
{{- if and .Values.config.limits.rateLimitEnabled (not .Values.config.limits.forwardedAllowIps) }}
{{- fail "ingress.enabled and config.limits.rateLimitEnabled are true with no config.limits.forwardedAllowIps: every request reaches the pod from the ingress controller, so all clients would share ONE rate-limit bucket and one busy client would throttle everyone. Set config.limits.forwardedAllowIps to the controller's addresses -- the narrowest range that holds them; a whole pod range lets any pod in it name its own client address unless a NetworkPolicy admits only the controller -- or set config.limits.rateLimitEnabled=false and limit at the ingress." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "classification-api.fullname" . }}
  labels: {{ include "classification-api.labels" . | nindent 4 }}
  {{- with merge .Values.ingress.annotations .Values.global.cluster.cert.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.cluster.ingress.ingressClassName }}
  ingressClassName: {{ .Values.global.cluster.ingress.ingressClassName | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $.Values.ingress.paths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "classification-api.fullname" $ }}
            port:
              number: {{ $.Values.service.port }}
      {{- end }}
  {{- end }}
{{- end }}
