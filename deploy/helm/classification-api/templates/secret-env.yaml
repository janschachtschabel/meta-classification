{{/*
  Skipped entirely when config.auth.existingSecret names a Secret managed outside the
  chart: rendering an empty one beside it would leave two candidates for the same
  envFrom and no way to tell which the pod reads.
*/}}
{{- if not .Values.config.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "classification-api.fullname" . }}-env
  labels: {{ include "classification-api.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.config.auth.enabled }}
data:
  APIV3_API_KEY_ADMIN: {{ required (include "classification-api.keyRequired" "adminKey") .Values.config.auth.adminKey | b64enc | quote }}
  APIV3_API_KEY_READONLY: {{ required (include "classification-api.keyRequired" "readonlyKey") .Values.config.auth.readonlyKey | b64enc | quote }}
{{- else }}
data: {}
{{- end }}
{{- end }}
