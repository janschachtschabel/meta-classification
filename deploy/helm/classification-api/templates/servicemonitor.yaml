{{- /* Scrapes the public GET /metrics (Prometheus text format; no auth needed). */ -}}
{{- if .Values.global.metrics.servicemonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "classification-api.fullname" . }}
  labels: {{ include "classification-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "classification-api.selectorLabels" . | nindent 6 }}
    # Both Services carry the selector labels, and selecting the headless one too scraped
    # every pod twice (audit 2026-09-30, B07).
    matchExpressions:
    - key: service.kubernetes.io/headless
      operator: DoesNotExist
  endpoints:
  - port: http
    path: /metrics
{{- end }}
