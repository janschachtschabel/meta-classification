# =============================================================================
# GitLab CI/CD — MetaClassify (production deployment)
# =============================================================================
# Active pipeline configuration for the company GitLab repo (standard path in
# the repo root). Does not touch the GitHub workflows (.github/workflows/) —
# both platforms run in parallel (GitHub → ghcr.io, GitLab → self-hosted).
#
# CREDENTIALS / COMPANY-SPECIFIC — do NOT put them here; create them in GitLab
# under  Settings → CI/CD → Variables  as (masked + protected) variables:
#   DOCKER_REGISTRY   e.g. docker.edu-sharing.com   (registry host)
#   DOCKER_USERNAME   CI user / deploy-token user
#   DOCKER_PASSWORD   CI token / password           (masked + protected)
#   DIND_IMAGE        e.g. docker:27-dind
#   DIND_HOST         e.g. tcp://docker:2376
#   DIND_DRIVER       e.g. overlay2
#   DIND_TLS_CERTDIR  e.g. /certs
#
# Image path: DOCKER_IMAGE_PATH below — override as a CI/CD variable if needed.
#
# The Docker build (stage "build") only runs when DOCKER_REGISTRY is set —
# while the variables are missing the pipeline stays green (lint/test only).
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  # Image path inside the registry (without the registry host). Full pull path
  # is "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH" →
  #   docker.edu-sharing.com/projects/wlo/classification-api
  # Fixed path instead of $CI_PROJECT_PATH so the GitLab group hierarchy does
  # not leak into the image repo. Override as a CI/CD variable if needed.
  DOCKER_IMAGE_PATH: "projects/wlo/classification-api"

  # --- Do NOT set the following here; use CI/CD variables (see header) ---
  # DOCKER_REGISTRY / DOCKER_USERNAME / DOCKER_PASSWORD
  # DIND_IMAGE / DIND_HOST / DIND_DRIVER / DIND_TLS_CERTDIR
  #
  # --- Helm chart push (stage "deploy") ---
  # HELM_REGISTRY     upload URL of the chart repo
  # HELM_USERNAME     chart-repo user / deploy-token user
  # HELM_PASSWORD     chart-repo token / password  (masked + protected)

# -----------------------------------------------------------------------------
# Lint (ruff) — configuration lives in pyproject.toml
# -----------------------------------------------------------------------------
ruff check:
  stage: lint
  timeout: 10 minutes
  interruptible: true
  image:
    # Keep in sync with requirements-dev.txt (the version the code is developed against).
    name: ghcr.io/astral-sh/ruff:0.12.9-alpine
  before_script:
    - cd "$CI_PROJECT_DIR"
    - ruff --version
  script:
    - ruff check --output-format=gitlab app/ tests/ scripts/ > "$CI_PROJECT_DIR/code-quality-report.json"
  artifacts:
    reports:
      codequality: code-quality-report.json

# -----------------------------------------------------------------------------
# Helm chart lint — validates templates/values on every pipeline (the package/
# push job below runs on tags, and on main/develop, once HELM_REGISTRY is set).
# -----------------------------------------------------------------------------
helm lint:
  stage: lint
  timeout: 10 minutes
  interruptible: true
  image:
    # Pinned like every other image in this repo (digest-pinned base, SHA-pinned
    # actions): `latest` could drift or break the release path without any
    # repo change. Keep in sync manually on helm upgrades.
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    # `helm lint` runs the templates in lint mode, where `required` and `fail` only log
    # [INFO]: it ended 0 with every guard firing (audit 2026-09-30, B11). So it lints, strictly,
    # values that satisfy every guard, and the same values are rendered -- a guard firing on
    # them fails the job. That the guards fire where they should is tests/test_helm_chart.py's,
    # in the pytest job.
    - helm lint --strict deploy/helm/classification-api -f deploy/helm/classification-api/ci/lint-values.yaml
    - helm template release deploy/helm/classification-api -f deploy/helm/classification-api/ci/lint-values.yaml

# -----------------------------------------------------------------------------
# Types (mypy) — same gate as CLAUDE.md ("Types: python -m mypy app ...")
# -----------------------------------------------------------------------------
mypy:
  stage: lint
  timeout: 10 minutes
  interruptible: true
  image: python:3.11-slim-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR"
    - python -m pip install --upgrade pip
    # Same fully-hashed transitive tree the Docker image ships.
    - pip install --require-hashes -r requirements-hashes.lock
    - pip install -r requirements-dev.txt
  script:
    - python -m mypy app --config-file pyproject.toml
    # As GitHub does: the two scripts that write inside a bundle earn the same gate (audit T-5);
    # this job checked app/ only (audit 2026-09-30, B11).
    - python -m mypy scripts/patch_bundle_labels.py scripts/prune_bundle_labels.py --config-file pyproject.toml

# -----------------------------------------------------------------------------
# Tests (pytest) — the actual regression safety net. Runs BEFORE the Docker
# build (own stage) so a test failure stops the build.
# -----------------------------------------------------------------------------
pytest:
  stage: test
  timeout: 25 minutes
  interruptible: true
  image: python:3.11-slim-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR"
    # tests/test_helm_chart.py refuses to skip where CI is set -- and GitLab always sets it --
    # so this job needs a helm, or its render tests fail and nothing behind this stage ever
    # runs (audit 2026-09-30, B01). Same version as the chart's lint and package jobs below,
    # verified against the release's published checksum (get.helm.sh/<file>.sha256sum).
    - python -c "import urllib.request; urllib.request.urlretrieve('https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz', '/tmp/helm.tgz')"
    - echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tgz" | sha256sum -c -
    - tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - helm version
    - python -m pip install --upgrade pip
    # Same fully-hashed transitive tree the Docker image ships.
    - pip install --require-hashes -r requirements-hashes.lock
    - pip install -r requirements-dev.txt
  script:
    # Under coverage, with the floor in pyproject as the gate (see the GitHub workflow).
    - python -m coverage run -m pytest tests -q
    - python -m coverage combine
    - python -m coverage report

# -----------------------------------------------------------------------------
# Known CVEs in the tree the image ships. Own job in the `test` stage so a
# vulnerable pin stops the build, exactly like a failing test does.
#
# This pipeline is the one that feeds the deployed registry, so it needs its own
# gate: the GitHub workflows audit the ghcr.io image, which is not what runs here.
# Without it a pinned CVE is invisible to everything this pipeline does — anyio
# 4.14.1 sat pinned with three of them while every gate was green (2026-09-19).
#
# --require-hashes --disable-pip audits the lock pin for pin. --no-deps alone
# would still let pip resolve, which is a different tree from the one installed.
# -----------------------------------------------------------------------------
pip-audit:
  stage: test
  timeout: 10 minutes
  interruptible: true
  image: python:3.11-slim-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR"
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - python -m pip_audit -r requirements-hashes.lock --require-hashes --disable-pip --progress-spinner off
    # The same tree as a CycloneDX SBOM, kept with the pipeline: GitHub's image carries one from
    # buildx, and this pipeline -- the one feeding the deployed registry -- had none (audit
    # 2026-09-30, B11).
    - python -m pip_audit -r requirements-hashes.lock --require-hashes --disable-pip --progress-spinner off --format cyclonedx-json --output sbom.cdx.json
  artifacts:
    reports:
      cyclonedx: sbom.cdx.json

# -----------------------------------------------------------------------------
# Licences of the tree the image ships -- GitHub's gate (ci.yml, audit job), verbatim:
# pip-licenses pinned as in requirements-dev.txt, then the hashed tree, so its pins win;
# --partial-match because no package calls its licence just "GPL" (audit 2026-09-30, B05).
# This pipeline had no licence gate at all (B11).
# -----------------------------------------------------------------------------
licences:
  stage: test
  timeout: 10 minutes
  interruptible: true
  image: python:3.11-slim-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR"
    - pip install pip-licenses==5.5.5
    - pip install --require-hashes -r requirements-hashes.lock
  script:
    - python -m piplicenses --fail-on "GPL;AGPL;LGPL" --partial-match --format markdown --order license

# -----------------------------------------------------------------------------
# Build Docker image + push to (self-hosted) registry — main + develop
# Tag = branch slug (e.g. "main", "develop")
# -----------------------------------------------------------------------------
build and push (branches):
  stage: build
  timeout: 30 minutes
  image: $DIND_IMAGE
  variables:
    DOCKER_HOST: "$DIND_HOST"
    DOCKER_DRIVER: "$DIND_DRIVER"
    DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]
  before_script:
    - docker --version
  script:
    # --password-stdin keeps the secret out of the process list on shared runners.
    - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
    # Two tags: the branch slug for "whatever is current on main", and an IMMUTABLE
    # sha- tag. Without the second, Helm revisions N and N-1 both resolve to ":main",
    # so `helm rollback` restores values but re-deploys the same image -- and with
    # pullPolicy IfNotPresent a node that cached it never even re-pulls.
    - docker buildx build
        --tag "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:$CI_COMMIT_REF_SLUG"
        --tag "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:sha-$CI_COMMIT_SHORT_SHA" .
    - docker image push "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:$CI_COMMIT_REF_SLUG"
    - docker image push "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:sha-$CI_COMMIT_SHORT_SHA"
  rules:
    # Only runs when the registry variable is set. While the CI/CD variables
    # (DOCKER_REGISTRY etc.) are missing the job is skipped — the pipeline
    # stays green (instead of failing at login).
    - if: "$CI_COMMIT_BRANCH == 'main' && $DOCKER_REGISTRY"
    - if: "$CI_COMMIT_BRANCH == 'develop' && $DOCKER_REGISTRY"

# -----------------------------------------------------------------------------
# Build + push Docker image on tag creation (e.g. v1.2.0)
# Tags = the git tag (v1.2.0) and the bare version (1.2.0) -- the second is what
# the chart names as its appVersion
# -----------------------------------------------------------------------------
build and push (tags):
  stage: build
  timeout: 30 minutes
  image: $DIND_IMAGE
  variables:
    DOCKER_HOST: "$DIND_HOST"
    DOCKER_DRIVER: "$DIND_DRIVER"
    DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]
  before_script:
    - docker --version
  script:
    # --password-stdin keeps the secret out of the process list on shared runners.
    - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
    # Also the bare version: the chart names its image by appVersion (4.0.1, no "v"), and
    # installed from the repository as its README says, it pulled a tag no pipeline had
    # pushed to this registry (audit 2026-09-30, B02).
    - docker buildx build
        --tag "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:$CI_COMMIT_REF_NAME"
        --tag "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:${CI_COMMIT_TAG#v}" .
    - docker image push "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:$CI_COMMIT_REF_NAME"
    - docker image push "$DOCKER_REGISTRY/$DOCKER_IMAGE_PATH:${CI_COMMIT_TAG#v}"
  rules:
    # Only on tag AND configured registry (see above).
    - if: "$CI_COMMIT_TAG && $DOCKER_REGISTRY"

# -----------------------------------------------------------------------------
# Package Helm chart + push to the chart repo
# Chart/app version = git tag (on tags); on branches 0.0.0-<branch-slug>.<pipeline>
# and the immutable sha-<commit> image the branch build pushed
# -----------------------------------------------------------------------------
.helm_base:
  stage: deploy
  image:
    # Pinned like every other image in this repo (digest-pinned base, SHA-pinned
    # actions): `latest` could drift or break the release path without any
    # repo change. Keep in sync manually on helm upgrades.
    name: alpine/helm:3.16.4
    entrypoint: [""]
  before_script:
    - helm version
  script:
    - helm package deploy/helm/classification-api
        --version "$CHART_VERSION"
        --app-version "$APP_VERSION"
    - >
      curl --fail --silent --show-error
      -u "$HELM_USERNAME:$HELM_PASSWORD"
      --upload-file edu_sharing-projects-wlo-classification-api-${CHART_VERSION}.tgz
      $HELM_REGISTRY

build and push helm chart:
  extends: .helm_base
  timeout: 15 minutes
  variables:
    # One chart per pipeline, naming the image it built. With "0.0.0-main" and ":main" every
    # main pipeline produced the same chart: `helm upgrade` left the pod spec unchanged, the
    # pod never rolled, IfNotPresent kept the cached image, and `helm rollback` restored the
    # same ":main" (audit 2026-09-30, B03).
    CHART_VERSION: "0.0.0-$CI_COMMIT_REF_SLUG.$CI_PIPELINE_IID"
    APP_VERSION: "sha-$CI_COMMIT_SHORT_SHA"
  rules:
    # Tag → chart/app version = exact tag name. Only with a configured chart
    # repo (HELM_REGISTRY) — otherwise skipped, pipeline stays green.
    - if: "$CI_COMMIT_TAG && $HELM_REGISTRY"
      variables:
        CHART_VERSION: "$CI_COMMIT_REF_NAME"
        APP_VERSION: "$CI_COMMIT_REF_NAME"
    # Branch charts mirror the docker jobs: main/develop only — feature branches
    # would clutter the chart repo with 0.0.0-<slug> charts whose appVersion
    # image tags were never built.
    - if: "$CI_COMMIT_BRANCH == 'main' && $HELM_REGISTRY"
    - if: "$CI_COMMIT_BRANCH == 'develop' && $HELM_REGISTRY"
